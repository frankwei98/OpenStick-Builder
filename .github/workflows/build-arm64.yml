name: Build ARM64 Native

on:
  workflow_dispatch:
    inputs:
      board:
        description: Optional preconfigured board profile
        required: true
        type: choice
        default: generic
        options:
          - generic
          - ufi003
          - uz801

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      OPENSTICK_BOARD: ${{ inputs.board }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - name: Report build host
        run: |
          uname -m
          dpkg --print-architecture
          df -h /

      - name: Run OpenStick regression tests
        run: |
          tests/test-build-host-architecture.sh
          tests/test-build-mount-cleanup.sh
          tests/test-build-output-isolation.sh
          tests/test-ci-gate.sh
          tests/test-image-configuration.sh
          tests/test-kernel-package.sh
          tests/test-openstick-modem-isolate.sh
          tests/test-openstick-board.sh

      - name: Prepare clean build workspace
        run: time sudo sh -e scripts/prepare-build.sh

      - name: Install dependencies
        run: time sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: time sudo --preserve-env=OPENSTICK_BOARD sh -e scripts/build_hyp_aboot.sh

      - name: Extract MSM8916 firmware
        run: time sudo sh -e scripts/extract_fw.sh

      - name: Create rootfs natively
        run: time sudo --preserve-env=OPENSTICK_BOARD sh -e scripts/debootstrap.sh

      - name: Build gadget-tool natively
        run: time sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: time sudo sh -e scripts/build_images.sh

      - name: Validate ARM64 artifacts
        run: |
          test "$(sudo chroot rootfs dpkg --print-architecture)" = arm64
          grep -q '^VERSION_ID="13"$' rootfs/etc/os-release
          grep -q '^VERSION_CODENAME=trixie$' rootfs/etc/os-release
          test ! -e rootfs/usr/bin/qemu-aarch64-static
          ! tar -tzf rootfs.tgz ./usr/bin/qemu-aarch64-static >/dev/null 2>&1
          readelf -h files/hyp.mbn | grep -q 'Machine:.*AArch64'
          readelf -h files/hyp.mbn | grep -q 'Class:.*ELF64'
          readelf -h files/aboot.mbn | grep -q 'Machine:.*ARM'
          readelf -h files/aboot.mbn | grep -q 'Class:.*ELF32'
          file dist/usr/bin/gt | grep -q 'ARM aarch64'
          readelf -h dist/usr/bin/gt | grep -q 'Machine:.*AArch64'
          readelf -h dist/usr/lib/libusbgx.so.2.0.0 |
              grep -q 'Machine:.*AArch64'
          readelf -d dist/usr/bin/gt | grep -q 'Shared library: \[libconfig.so.11\]'
          if sudo find rootfs dist files -type f -exec file {} + |
              grep -q 'x86-64'; then
            echo "x86-64 ELF found in ARM64 build output" >&2
            exit 1
          fi
          for artifact in \
              aboot.mbn \
              boot.bin \
              gpt_both0.bin \
              hyp.mbn \
              rootfs.bin \
              rpm.mbn \
              sbl1.mbn \
              tz.mbn; do
            test -s "files/${artifact}"
          done
          file files/*
          sudo du -sh rootfs rootfs.tgz dist files
          df -h /

      - name: Validate artifacts
        run: sudo sh -e scripts/validate-artifacts.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian-arm64-${{ inputs.board }}
          path: files/*
