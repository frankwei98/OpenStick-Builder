name: Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: Optional preconfigured board profile
        required: true
        type: choice
        default: generic
        options:
          - generic
          - ufi003
          - uz801

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENSTICK_BOARD: ${{ inputs.board }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run OpenStick regression tests
        run: |
          tests/test-build-host-architecture.sh
          tests/test-build-mount-cleanup.sh
          tests/test-image-configuration.sh
          tests/test-openstick-modem-isolate.sh
          tests/test-openstick-board.sh

      - name: Install dependencies
        run: sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: sudo --preserve-env=OPENSTICK_BOARD sh -e scripts/build_hyp_aboot.sh

      - name: Extract MSM8916 firmware
        run: sudo sh -e scripts/extract_fw.sh

      - name: Create rootfs
        run: sudo --preserve-env=OPENSTICK_BOARD sh -e scripts/debootstrap.sh

      - name: Build gadget-tool
        run: sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: sudo sh -e scripts/build_images.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian-${{ inputs.board }}
          path: files/*
