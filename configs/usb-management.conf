# USB point-to-point management network.
#
# This is the single source used to generate the NetworkManager, DHCP and SSH
# configuration in the root filesystem.
USB_INTERFACE="usb0"
USB_DEVICE_ADDRESS="172.30.255.1"
USB_PREFIX="30"
USB_HOST_ADDRESS="172.30.255.2"
USB_NETMASK="255.255.255.252"
USB_DHCP_LEASE="12h"
