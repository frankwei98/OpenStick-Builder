# OpenStick USB development gadget
#
# Boolean values use 1 (enabled) or 0 (disabled).
ENABLE_RNDIS=1
ENABLE_ACM=1
ENABLE_UMS=1

USB_VENDOR_ID="0x1d6b"
USB_PRODUCT_ID="0x0104"
USB_DEVICE_VERSION="0x0100"
USB_MANUFACTURER="OpenStick"
USB_PRODUCT="OpenStick Development Board"

# Leave empty to derive and persist a stable value on first boot.
USB_SERIAL=""
RNDIS_HOST_MAC=""
RNDIS_DEVICE_MAC=""

UMS_IMAGE="/var/lib/openstick-usb-gadget/storage.img"
UMS_IMAGE_SIZE_MB=100
UMS_LABEL="OPENSTICK"
UMS_READONLY=0

# Leave empty to use the first available USB device controller.
UDC_DEVICE=""
